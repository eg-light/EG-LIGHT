<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egy Light - Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #050505 0%, #1a0202 50%, #7a0909 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        /* iPhone 17 Pro Max Glassmorphism Card Container */
        .glass-card {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 45px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Container */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo-container img {
            width: 160px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .logo-subtitle {
            font-size: 0.95rem;
            color: #d1d1d1;
            letter-spacing: 1.5px;
            font-weight: 500;
            text-align: center;
        }

        /* Links Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        /* Button Styling with Smooth Hover & Lighting Effect */
        .link-btn {
            position: relative;
            width: 100%;
            padding: 16px 24px;
            background: rgba(25, 25, 25, 0.5);
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            text-align: center;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220, 20, 60, 0.35), transparent);
            transition: 0.5s;
        }

        .link-btn:hover::before {
            left: 100%;
        }

        .link-btn:hover {
            background: rgba(180, 20, 20, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .link-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Logo Section -->
        <div class="logo-container">
            <img src="logo.png" alt="Egy Light Logo">
            <div class="logo-subtitle">Connect with us via social media</div>
        </div>

        <!-- 5 Social & Official Links -->
        <div class="links-container">
            <a href="https://wsend.co/201000393917" class="link-btn">WhatsApp</a>
            <a href="https://www.facebook.com/profile.php?id=100066431455842" class="link-btn">Facebook</a>
            <a href="https://www.eglight-elsewedy.com/" class="link-btn">Website</a>
            <a href="https://www.linkedin.com/company/eg-light-elsewedy-advanced-industries/?viewAsMember=true" class="link-btn">LinkedIn</a>
            <a href="https://www.instagram.com/eglight_elsewedy/" class="link-btn">Instagram</a>
        </div>
    </div>

</body>
</html>
