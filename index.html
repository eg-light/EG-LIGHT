<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egy Light - Contact & Branches</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #050505 0%, #1a0202 50%, #7a0909 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        /* iPhone 17 Pro Max Glassmorphism Card Container */
        .glass-card {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 45px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Container */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .logo-container img {
            width: 160px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .logo-subtitle {
            font-size: 0.95rem;
            color: #d1d1d1;
            letter-spacing: 1.5px;
            font-weight: 500;
            text-align: center;
        }

        /* Links Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        /* Hidden Class */
        .hidden {
            display: none !important;
        }

        /* Button Styling with Smooth Hover & Lighting Effect */
        .link-btn {
            position: relative;
            width: 100%;
            padding: 16px 24px;
            background: rgba(25, 25, 25, 0.5);
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            text-align: center;
            border: none;
            outline: none;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220, 20, 60, 0.35), transparent);
            transition: 0.5s;
        }

        .link-btn:hover::before {
            left: 100%;
        }

        .link-btn:hover {
            background: rgba(180, 20, 20, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .link-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Logo Section -->
        <div class="logo-container">
            <img src="logo.png" alt="Egy Light Logo">
            <div id="subtitle" class="logo-subtitle">Connect with us via social media</div>
        </div>

        <!-- الصفحة الرئيسية (روابط السوشيال ميديا + زر الفروع بنفس الديزاين) -->
        <div id="main-links" class="links-container">
            <a href="https://wsend.co/201000393917" class="link-btn" target="_blank">WhatsApp</a>
            <a href="https://www.facebook.com/profile.php?id=100066431455842" class="link-btn" target="_blank">Facebook</a>
            <a href="https://www.eglight-elsewedy.com/" class="link-btn" target="_blank">Website</a>
            <a href="https://www.linkedin.com/company/eg-light-elsewedy-advanced-industries/?viewAsMember=true" class="link-btn" target="_blank">LinkedIn</a>
            <a href="https://www.instagram.com/eglight_elsewedy/" class="link-btn" target="_blank">Instagram</a>
            
            <!-- زر الفروع بنفس ديزاين باقي الأزرار تماماً -->
            <button onclick="openBranches()" class="link-btn">عناوين الفروع</button>
        </div>

            <a href="https://www.google.com/maps?q=30.0536562,31.2441935&z=17&hl=ar" class="link-btn" target="_blank">وسط البلد</a>
            <a href="https://www.google.com/maps/place/31%C2%B011'39.5%22N+29%C2%B053'28.3%22E/@31.1959195,29.8921312,19z/data=!4m4!3m3!8m2!3d31.1943019!4d29.8912006?hl=ar&entry=ttu&g_ep=EgoyMDI2MDkyMS4wIKXMDSoASAFQAw%3D%3D" class="link-btn" target="_blank"ك>الاسكندريه</a>
            <a href="https://www.google.com/maps?q=29.9483835,30.9050898&z=17&hl=ar" class="link-btn" target="_blank">اكتوبر</a>

            <!-- زر الرجوع للرئيسية بنفس شكل الأزرار -->
            <button onclick="openMain()" class="link-btn" style="margin-top: 10px;">رجوع</button>
        </div>
    </div>


    <script>
        function openBranches() {
            document.getElementById('main-links').classList.add('hidden');
            document.getElementById('branches-links').classList.remove('hidden');
            document.getElementById('subtitle').innerText = "Our Branches";
        }

        function openMain() {
            document.getElementById('branches-links').classList.add('hidden');
            document.getElementById('main-links').classList.remove('hidden');
            document.getElementById('subtitle').innerText = "Connect with us via social media";
        }
    </script>

</body>
</html>
